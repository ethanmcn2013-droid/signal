name: Design quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: signal-design-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experience-registry:
    name: Experience registry and design-system gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prove unregistered routes are rejected
        run: npm run experience:self-test

      - name: Validate experience registry
        run: npm run experience:validate

      - name: Typecheck
        run: npm run typecheck

      - name: Design-system drift gate
        run: npm run ds:check
