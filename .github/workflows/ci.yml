name: ci

# Production safety gate for Signal (repo: analytics).
# Required gates (block merge): typecheck + test — both verified green
# (116 lib unit tests pass). This repo uses npm (package-lock.json).
# Node 22 so the `node --test` glob discovers src/lib/**/*.test.ts.
# Lint is informational until its existing errors are cleared.
# Added 2026-06-18 (production-readiness audit, blocker #3).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pin npm to the version package.json declares (packageManager).
      # Node 22 bundles npm 10, whose `npm ci` computes a different
      # ideal tree for OR-ranges (tsx → esbuild ^0.27 || ^0.28) than
      # the npm 11 that writes this repo's lockfile — npm 10 rejected
      # a lock npm 11 considers in sync. CI must validate with the
      # same npm that produces the artifact it validates.
      - name: Pin npm to packageManager version
        run: npm install -g npm@11.12.1

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint (informational — does not block)
        run: npm run lint
        continue-on-error: true
